name: Build Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build & sign release artifacts
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────────────────────────
      # AGP 9.x requires JDK 17+.  The Kotlin jvmToolchain(11) target is for
      # *source* compilation and is unaffected by the host JDK version.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Gradle ──────────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Version ─────────────────────────────────────────────────────────────
      # Derive versionName / versionCode from the release tag (e.g. "v1.2.3").
      # versionCode = major*10000 + minor*100 + patch  →  1.2.3 → 10203
      - name: Compute version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.3
          VERSION="${TAG#v}"                # strip leading 'v' → 1.2.3
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR="${MAJOR:-1}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version_name=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"

      # ── Signing keystore ────────────────────────────────────────────────────
      # Store a base-64-encoded keystore in the repo secret KEYSTORE_BASE64.
      # Generate it locally with:
      #   base64 -w 0 your-release-key.jks
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/keystore.jks"

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build release APK & AAB
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"
        env:
          SIGNING_STORE_FILE:     ${{ github.workspace }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.SIGNING_KEY_PASSWORD }}

      # ── Upload artifacts to the GitHub release ───────────────────────────────
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

      - name: Upload AAB to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/*.aab
